<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>ASCENT — Pathway Builder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- HOME's 3D model starts loading with the page — only when the address opens HOME, and it is
         the stored avatar's model (keys and files as in src/data/cast.ts; the clinician by default) -->
    <script>
      (function () {
        var id = location.hash.replace(/^#\/?/, '');
        if (id && id !== 'home') return;
        var models = { clinician: '/models/clinician.glb', strategist: '/models/strategist.glb', analyst: '/models/analyst.glb' };
        var key = null;
        try {
          key = localStorage.getItem('ascent.avatar');
        } catch (e) {}
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = Object.prototype.hasOwnProperty.call(models, key) ? models[key] : models.clinician;
        document.head.appendChild(link);
      })();
    </script>
    <!-- the theme is applied before any stylesheet arrives, so the first frame is already right -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('ascent.theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <style>
      html, body { margin: 0; background: #000; }
      html[data-theme='light'], html[data-theme='light'] body { background: #eef0f3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
