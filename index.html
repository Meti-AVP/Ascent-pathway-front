<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>ASCENT — Pathway Builder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/models/clinician.glb" as="fetch" crossorigin="anonymous" />
    <!-- the theme is applied before any stylesheet arrives, so the first frame is already right -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('ascent.theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <style>
      html, body { margin: 0; background: #000; }
      html[data-theme='light'], html[data-theme='light'] body { background: #eef0f3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
